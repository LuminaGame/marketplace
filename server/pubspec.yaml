name: lumina_marketplace_server
description: The Lumina Marketplace API — accounts, listings, uploads, free licenses, moderation and search.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  archive: ^4.3.0
  crypto: ^3.0.7
  cryptography: ^2.9.0
  dart_jsonwebtoken: ^3.4.1
  lumina_marketplace_shared:
    path: ../shared
  path: ^1.9.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  # ^3.5.2, not ^3.6.0: the web package also depends on flutter_filament,
  # whose native build hook is on hooks 1.x; sqlite3 3.6 needs hooks 2.
  sqlite3: ^3.5.2
  yaml: ^3.1.4
dev_dependencies:
  http: ^1.6.0
  lints: ^6.1.0
  test: ^1.31.1
